# SPDX-License-Identifier: Apache-2.0
# Frozen v1 control-plane schema; native inference bodies intentionally remain opaque.
openapi: "3.1.0"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: "NomiFun Model Gateway Protocol v1"
  version: "1.0"
  summary: "Independent community-operated gateway contract and M0 synthetic mock"
  description: "NomiFun official does not operate gateway instances, sell API access or run paid services. Community partners independently operate instances. Clients configure the base URL at runtime. This document freezes control-plane fields and native passthrough boundaries; opaque native schemas are not exhaustive upstream validators. Unknown additive control fields are accepted. credentials cannot enter URLs except the sole inbound Gemini ?key compatibility on its two native routes; never use query credentials in desktop clients, examples, redirects or logs. Auth conflicts/malformed sources fail401. All responses require x-request-id and Cache-Control:no-store;429 also Retry-After. See docs/protocol/v1.md for semantic and affinity obligations."
  license:
    name: "Apache License 2.0"
    identifier: "Apache-2.0"
servers:
  -
    url: "/"
    description: "Runtime-configured deployment API root; no official operated instance or compiled-in commercial URL."
tags:
  -
    name: "Control plane"
  -
    name: "Native inference"
security:
  -
    BearerAuth: []
  -
    XAPIKeyAuth: []
  -
    XGoogAPIKeyAuth: []
paths:
  "/nomifun/v1/meta":
    get:
      operationId: "getMeta"
      tags:
        - "Control plane"
      summary: "Read anonymous instance metadata"
      security: []
      responses:
        "200":
          description: "Success. Required fields retain exact v1 semantics and unknown additive fields are accepted."
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Meta"
        "400":
          $ref: "#/components/responses/ControlFailure"
        "401":
