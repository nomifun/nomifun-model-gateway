    GeminiGatewayError:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
            - "status"
            - "details"
          properties:
            code:
              type: "integer"
              minimum: 400
              maximum: 599
              description: "Native integer HTTP status, never a business-code string."
            message:
              type: "string"
              minLength: 1
            status:
              type: "string"
              minLength: 1
              description: "Native Google RPC status name."
            details:
              type: "array"
              items:
                $ref: "#/components/schemas/NativeBody"
              minItems: 1
              contains:
                $ref: "#/components/schemas/GoogleErrorInfo"
              minContains: 1
          additionalProperties: true
      additionalProperties: true
    Model:
      type: "object"
      required:
        - "id"
        - "display_name"
        - "vendor"
        - "tasks"
        - "task_endpoints"
        - "context_window"
        - "max_output_tokens"
        - "input_modalities"
        - "traits"
        - "pricing"
        - "included_in_plan"
        - "status"
      properties:
        id:
          type: "string"
          minLength: 1
        display_name:
          type: "string"
          minLength: 1
        vendor:
          type: "string"
          minLength: 1
        tasks:
          type: "array"
          items:
            $ref: "#/components/schemas/Task"
          minItems: 1
          uniqueItems: true
        task_endpoints:
          type: "object"
          minProperties: 1
          propertyNames:
            enum:
              - "chat"
              - "image_generation"
              - "image_edit"
              - "embedding"
              - "rerank"
          properties:
            chat:
              allOf:
                -
                  $ref: "#/components/schemas/TaskEndpoints"
                -
                  properties:
                    endpoints:
                      items:
                        type: "string"
                        enum:
                          - "openai"
                          - "openai-response"
                          - "anthropic"
                          - "gemini"
                    preferred_endpoint:
                      type: "string"
                      enum:
                        - "openai"
                        - "openai-response"
                        - "anthropic"
                        - "gemini"
            image_generation:
              allOf:
                -
                  $ref: "#/components/schemas/TaskEndpoints"
                -
                  properties:
                    endpoints:
                      items:
                        type: "string"
                        enum:
                          - "image-generation"
                    preferred_endpoint:
                      type: "string"
                      enum:
                        - "image-generation"
            image_edit:
              allOf:
                -
                  $ref: "#/components/schemas/TaskEndpoints"
                -
                  properties:
                    endpoints:
                      items:
                        type: "string"
                        enum:
                          - "image-generation"
                    preferred_endpoint:
                      type: "string"
                      enum:
                        - "image-generation"
            embedding:
              allOf:
                -
                  $ref: "#/components/schemas/TaskEndpoints"
                -
                  properties:
                    endpoints:
                      items:
                        type: "string"
                        enum:
                          - "embeddings"
                    preferred_endpoint:
                      type: "string"
                      enum:
                        - "embeddings"
            rerank:
              allOf:
                -
                  $ref: "#/components/schemas/TaskEndpoints"
                -
                  properties:
                    endpoints:
                      items:
                        type: "string"
                        enum:
                          - "jina-rerank"
                    preferred_endpoint:
                      type: "string"
                      enum:
                        - "jina-rerank"
          additionalProperties:
            $ref: "#/components/schemas/TaskEndpoints"
        context_window:
          type:
            - "integer"
            - "null"
          minimum: 1
          maximum: 9223372036854775807
          description: "Null means unknown or inapplicable."
        max_output_tokens:
          type:
            - "integer"
            - "null"
          minimum: 1
          maximum: 9223372036854775807
          description: "Must be a positive int64 when any preferred endpoint is anthropic."
        input_modalities:
          type: "array"
          items:
            type: "string"
            minLength: 1
          uniqueItems: true
        traits:
          type: "array"
          items:
            type: "string"
            minLength: 1
          uniqueItems: true
        pricing:
          type: "array"
          items:
            $ref: "#/components/schemas/Price"
        included_in_plan:
          type: "boolean"
        status:
          type: "string"
          enum:
            - "available"
            - "degraded"
            - "unavailable"
      additionalProperties: true
      allOf:
        -
          if:
            properties:
              tasks:
                contains:
                  const: "chat"
          then:
            properties:
              task_endpoints:
                required:
                  - "chat"
        -
          if:
            properties:
              task_endpoints:
                required:
                  - "chat"
          then:
            properties:
              tasks:
                contains:
                  const: "chat"
                minContains: 1
        -
          if:
            properties:
              tasks:
                contains:
                  const: "image_generation"
          then:
            properties:
              task_endpoints:
                required:
                  - "image_generation"
        -
          if:
            properties:
              task_endpoints:
                required:
                  - "image_generation"
          then:
            properties:
              tasks:
                contains:
                  const: "image_generation"
                minContains: 1
        -
          if:
            properties:
              tasks:
                contains:
                  const: "image_edit"
          then:
            properties:
              task_endpoints:
                required:
                  - "image_edit"
        -
          if:
            properties:
              task_endpoints:
                required:
                  - "image_edit"
          then:
            properties:
              tasks:
                contains:
                  const: "image_edit"
                minContains: 1
        -
          if:
            properties:
              tasks:
                contains:
                  const: "embedding"
          then:
            properties:
              task_endpoints:
                required:
                  - "embedding"
        -
          if:
            properties:
              task_endpoints:
                required:
                  - "embedding"
          then:
            properties:
              tasks:
                contains:
                  const: "embedding"
                minContains: 1
        -
          if:
            properties:
              tasks:
                contains:
                  const: "rerank"
          then:
            properties:
              task_endpoints:
                required:
                  - "rerank"
        -
          if:
            properties:
              task_endpoints:
                required:
                  - "rerank"
          then:
            properties:
              tasks:
                contains:
                  const: "rerank"
                minContains: 1
        -
          if:
            properties:
              task_endpoints:
                required:
                  - "chat"
                properties:
                  chat:
                    required:
                      - "preferred_endpoint"
                    properties:
                      preferred_endpoint:
                        const: "anthropic"
          then:
            properties:
              max_output_tokens:
                type: "integer"
                minimum: 1
                maximum: 9223372036854775807
      description: "Required v1 control-plane model. tasks and task_endpoints match exactly; prices reference advertised tasks, IDs are unique per catalog and meter/currency prices cannot duplicate. Cross-field currency/task and date ordering constraints also apply per protocol prose and conformance."
    Catalog:
      type: "object"
      required:
        - "contract_version"
        - "models"
      properties:
        contract_version:
          type: "string"
          const: "1.0"
        models:
          type: "array"
          items:
            $ref: "#/components/schemas/Model"
      additionalProperties: true
