name: nomifun-model-gateway
services:
  database:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NMG_POSTGRES_USER:-model_gateway}
      POSTGRES_DB: ${NMG_POSTGRES_DB:-model_gateway}
      POSTGRES_PASSWORD: ${NMG_POSTGRES_PASSWORD:?Set the operator-owned NMG_POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 stores its versioned PGDATA below this parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  gateway:
    build: .
    image: nomifun-model-gateway:local
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NMG_LISTEN: 0.0.0.0:8789
      NMG_DB_DRIVER: postgres
      NMG_DB_DSN: ${NMG_DB_DSN:?Set NMG_DB_DSN for the internal database service}
      NMG_MASTER_KEY: ${NMG_MASTER_KEY:?Set a random 32-byte base64 NMG_MASTER_KEY}
      NMG_ADMIN_EMAIL: ${NMG_ADMIN_EMAIL:-}
      NMG_ADMIN_PASSWORD: ${NMG_ADMIN_PASSWORD:-}
    ports:
      - 127.0.0.1:${NMG_PORT:-8789}:8789
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    stop_grace_period: 30s
volumes:
  postgres-data:
